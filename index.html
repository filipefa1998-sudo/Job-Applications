<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Pipeline Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Job Pipeline">
  <meta name="theme-color" content="#0d1b2a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:       #f6f2e9;
      --card:        #fffdf7;
      --card2:       #efe9db;
      --gold:        #a8770e;
      --gold-deep:   #8a6510;
      --gold-light:  #c8941a;
      --gold-dim:    rgba(176,127,16,0.09);
      --gold-border: rgba(168,119,14,0.35);
      --text-main:   #1d2a3a;
      --text-muted:  #5b6b7d;
      --text-dim:    #97a3b0;
      --line:        rgba(29,42,58,0.10);
      --red:         #c0392b;
      --green:       #1e8e63;
      --blue:        #2f6ea8;
      --purple:      #6d47a8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .sync-bar {
      background: var(--card2);
      border-bottom: 1px solid var(--line);
      padding: 5px 28px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-muted);
    }
    .sync-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .sync-dot.connected { background: var(--green); }
    .sync-dot.saving    { background: var(--gold); }
    .sync-dot.error     { background: var(--red); }
    .header {
      background: var(--card);
      border-bottom: 2px solid var(--gold-border);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 1px 8px rgba(29,42,58,0.05);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo-mark {
      width: 38px; height: 38px;
      border: 1px solid var(--gold-border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: var(--gold-dim); flex-shrink: 0;
    }
    .header-left h1 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text-main); }
    .header-left p  { font-size: 11px; color: var(--gold-deep); letter-spacing: 0.07em; text-transform: uppercase; margin-top: 3px; }
    .stat-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { padding: 5px 13px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid; white-space: nowrap; }
    .chip-gold   { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold-deep); }
    .chip-green  { background: rgba(30,142,99,0.08); border-color: rgba(30,142,99,0.35); color: var(--green); }
    .chip-purple { background: rgba(109,71,168,0.08); border-color: rgba(109,71,168,0.35); color: var(--purple); }
    .toolbar {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 12px 28px;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .toolbar input, .toolbar select {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; padding: 8px 13px; outline: none;
    }
    .toolbar input:focus, .toolbar select:focus { border-color: var(--gold); }
    .toolbar input { width: 220px; }
    .toolbar input::placeholder { color: var(--text-dim); }
    .btn-add {
      margin-left: auto;
      background: var(--gold-deep); color: #fffdf7;
      border: none; border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600;
      padding: 8px 20px; cursor: pointer;
    }
    .btn-add:hover { background: var(--gold-light); }
    .pipeline-bar { padding: 14px 28px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    .p-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px; padding: 6px 14px;
      font-size: 12px; cursor: pointer; user-select: none;
    }
    .p-pill:hover  { border-color: var(--gold-border); }
    .p-pill.active { border-color: var(--gold); background: var(--gold-dim); }
    .p-pill .dot   { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .p-pill .count { font-weight: 600; }
    .p-pill .label { color: var(--text-muted); }
    .dot-saved        { background: var(--blue); }
    .dot-applied      { background: var(--gold-light); }
    .dot-interviewing { background: var(--green); }
    .dot-rejected     { background: var(--red); }
    .dot-offer        { background: var(--purple); }
    /* ---------- Insights dashboard ---------- */
    .dash {
      padding: 14px 28px 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
    }
    .dash-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 16px;
    }
    .dash-card h3 {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--gold-deep); margin-bottom: 9px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .dash-big { font-size: 24px; font-weight: 600; font-family: 'Playfair Display', serif; }
    .dash-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .goal-edit {
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); font-size: 12px; padding: 0 2px;
    }
    .goal-edit:hover { color: var(--gold-deep); }
    .goal-track {
      height: 9px; background: var(--card2);
      border-radius: 6px; overflow: hidden; margin-top: 9px;
    }
    .goal-fill {
      height: 100%; background: var(--gold-light);
      border-radius: 6px; transition: width 0.4s ease;
    }
    .goal-fill.done { background: var(--green); }
    .funnel-row { display: flex; align-items: center; gap: 7px; font-size: 12px; margin-top: 5px; }
    .funnel-row .f-label { width: 76px; color: var(--text-muted); flex-shrink: 0; }
    .funnel-row .f-bar   { height: 8px; border-radius: 4px; background: var(--gold-light); min-width: 3px; }
    .funnel-row.f-int  .f-bar { background: var(--green); }
    .funnel-row.f-off  .f-bar { background: var(--purple); }
    .funnel-row .f-num { font-weight: 600; white-space: nowrap; }
    .funnel-row .f-pct { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
    .sig-row { display: flex; justify-content: space-between; font-size: 12px; margin-top: 6px; gap: 8px; }
    .sig-row .s-ind  { color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sig-row .s-rate { font-weight: 600; color: var(--green); white-space: nowrap; }
    .sig-row .s-rate.cold { color: var(--text-dim); }
    .table-wrap { overflow-x: auto; flex: 1; padding: 16px 28px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1040px; background: var(--card); border-radius: 10px; }
    thead tr { border-bottom: 2px solid var(--gold-border); }
    th {
      padding: 10px 14px; text-align: left;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--gold-deep); white-space: nowrap;
      cursor: pointer; user-select: none;
    }
    th:hover { color: var(--gold-light); }
    th.active-sort .sort-arrow { opacity: 1 !important; }
    .sort-arrow { opacity: 0.4; margin-left: 2px; }
    tbody tr { border-bottom: 1px solid var(--line); transition: background 0.1s; }
    tbody tr:hover { background: var(--gold-dim); }
    td { padding: 12px 14px; vertical-align: middle; }
    .td-company  { font-weight: 600; white-space: nowrap; }
    .td-position, .td-date, .td-salary, .td-contact { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .td-notes { font-size: 12px; color: var(--text-dim); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ind-tag {
      display: inline-block; padding: 3px 9px;
      border-radius: 6px; font-size: 10.5px; font-weight: 600;
      background: var(--card2); color: var(--text-muted);
      border: 1px solid var(--line); white-space: nowrap;
    }
    .badge {
      display: inline-block; padding: 3px 10px;
      border-radius: 12px; font-size: 11px; font-weight: 600;
      letter-spacing: 0.04em; white-space: nowrap; border: 1px solid;
    }
    .badge-Saved        { background: rgba(47,110,168,0.08);  color: var(--blue);   border-color: rgba(47,110,168,0.35); }
    .badge-Applied      { background: var(--gold-dim);        color: var(--gold-deep); border-color: var(--gold-border); }
    .badge-Interviewing { background: rgba(30,142,99,0.08);   color: var(--green);  border-color: rgba(30,142,99,0.35); }
    .badge-Rejected     { background: rgba(192,57,43,0.07);   color: var(--red);    border-color: rgba(192,57,43,0.3); }
    .badge-Offer        { background: rgba(109,71,168,0.08);  color: var(--purple); border-color: rgba(109,71,168,0.35); }
    .followup-overdue { color: var(--red) !important; font-weight: 600; }
    .followup-soon    { color: var(--gold-deep) !important; font-weight: 600; }
    .link-anchor { color: var(--gold-deep); text-decoration: none; font-size: 12px; border-bottom: 1px dotted var(--gold-border); }
    .link-anchor:hover { color: var(--gold-light); }
    .act-btn { background: none; border: none; cursor: pointer; color: var(--text-dim); font-size: 15px; padding: 3px 6px; border-radius: 5px; }
    .act-btn:hover     { color: var(--gold-deep); }
    .act-btn.del:hover { color: var(--red); }
    .empty { text-align: center; padding: 72px 20px; color: var(--text-dim); font-size: 14px; }
    .empty-icon { font-size: 32px; opacity: 0.4; margin-bottom: 12px; }
    .footer {
      margin-top: 20px; padding: 11px 28px;
      border-top: 1px solid var(--line);
      background: var(--card);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--text-muted); flex-wrap: wrap; gap: 8px;
    }
    .btn-export {
      background: none; border: 1px solid var(--gold-border);
      color: var(--gold-deep); border-radius: 6px;
      padding: 5px 13px; font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .btn-export:hover { background: var(--gold-dim); }
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(29,42,58,0.45);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--gold-border);
      border-radius: 14px; padding: 30px 28px;
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.18s ease;
      box-shadow: 0 18px 50px rgba(29,42,58,0.22);
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .modal h2 { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--text-main); margin-bottom: 22px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-grid.full { grid-template-columns: 1fr; }
    .form-field label { display: block; font-size: 10px; font-weight: 600; color: var(--gold-deep); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; background: #fff;
      border: 1px solid var(--line); border-radius: 7px;
      color: var(--text-main); font-family: 'DM Sans', sans-serif;
      font-size: 13px; padding: 9px 13px; outline: none;
    }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--gold); }
    .form-field textarea { resize: vertical; min-height: 76px; }
    .field-hint { font-size: 10.5px; color: var(--text-dim); margin-top: 4px; min-height: 14px; }
    .field-hint b { color: var(--gold-deep); font-weight: 600; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
    .btn-cancel { background: none; border: 1px solid var(--line); color: var(--text-muted); border-radius: 7px; padding: 9px 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    .btn-cancel:hover { color: var(--text-main); border-color: var(--text-muted); }
    .btn-save { background: var(--gold-deep); color: #fffdf7; border: none; border-radius: 7px; padding: 9px 24px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-save:hover { background: var(--gold-light); }
    /* ---------- Print / Save-as-PDF report ---------- */
    #print-report { display: none; }
    @media print {
      @page { margin: 14mm 12mm; }
      body > *:not(#print-report) { display: none !important; }
      body { background: #fff !important; color: #16202c; display: block; }
      #print-report { display: block !important; font-family: 'DM Sans', Arial, sans-serif; color: #16202c; }
      #print-report .pr-head { border-bottom: 2.5px solid #c8941a; padding-bottom: 10px; margin-bottom: 6px; }
      #print-report h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 21pt; color: #0d1b2a; margin: 0; }
      #print-report .pr-sub { font-size: 8.5pt; color: #5a6b7e; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }
      #print-report .pr-meta { display: flex; justify-content: space-between; font-size: 8.5pt; color: #5a6b7e; margin: 8px 0 14px; }
      #print-report .pr-stats { font-size: 9pt; color: #16202c; margin-bottom: 14px; }
      #print-report .pr-stats b { color: #0d1b2a; }
      #print-report table { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
      #print-report th {
        text-align: left; font-size: 7.5pt; text-transform: uppercase; letter-spacing: 0.07em;
        color: #8a6510; border-bottom: 1.5px solid #c8941a; padding: 5px 7px; cursor: default;
      }
      #print-report td { padding: 6px 7px; border-bottom: 0.75px solid #d8dde3; vertical-align: top; }
      #print-report tr { page-break-inside: avoid; }
      #print-report .pr-company { font-weight: 600; color: #0d1b2a; }
      #print-report .pr-ind { font-weight: 400; font-size: 7pt; color: #8a97a5; margin-top: 1px; }
      #print-report .pr-badge {
        display: inline-block; border: 1px solid #999; border-radius: 9px;
        padding: 1px 8px; font-size: 7.5pt; font-weight: 600; white-space: nowrap;
      }
      #print-report .prb-Saved        { color: #2f6ea8; border-color: #2f6ea8; }
      #print-report .prb-Applied      { color: #8a6510; border-color: #a97e14; }
      #print-report .prb-Interviewing { color: #157a52; border-color: #157a52; }
      #print-report .prb-Rejected     { color: #b03a3a; border-color: #b03a3a; }
      #print-report .prb-Offer        { color: #6d47a8; border-color: #6d47a8; }
      #print-report .pr-notes { color: #44525f; }
      #print-report .pr-link { color: #44525f; font-size: 7.5pt; word-break: break-all; }
      #print-report .pr-footer { margin-top: 16px; padding-top: 8px; border-top: 0.75px solid #d8dde3; font-size: 7.5pt; color: #8a97a5; display: flex; justify-content: space-between; }
    }
    @media (max-width: 700px) {
      .header, .toolbar, .footer { padding: 14px 16px; }
      .sync-bar { padding: 5px 16px; }
      .toolbar input { width: 100%; }
      .toolbar select { flex: 1; min-width: 0; }
      .btn-add { margin-left: 0; width: 100%; padding: 11px; font-size: 14px; }
      .pipeline-bar { padding: 10px 16px 0; }
      .dash { padding: 10px 16px 0; grid-template-columns: 1fr; }
      .modal { padding: 22px 16px; }
      .form-grid { grid-template-columns: 1fr; }

      /* table becomes stacked cards */
      .table-wrap { padding: 12px 16px 0; overflow-x: visible; }
      table { min-width: 0; background: none; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tbody tr {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 10px;
        padding: 12px 14px;
      }
      tbody tr:hover { background: var(--card); }
      td { padding: 3px 0; border: none; }
      td[data-label]::before {
        content: attr(data-label);
        display: inline-block;
        width: 88px;
        font-size: 9.5px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.07em;
        color: var(--text-dim);
        vertical-align: top;
      }
      .td-company { font-size: 15px; padding-bottom: 6px; }
      .td-company::before { display: none !important; }
      .td-notes { max-width: none; white-space: normal; }
      .td-actions { padding-top: 8px; margin-top: 6px; border-top: 1px solid var(--line); display: flex; gap: 14px; }
      .act-btn { font-size: 16px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 7px; }
      td:empty, td.td-hide-empty { display: none; }
    }
  </style>
</head>
<body>

<div class="sync-bar">
  <div class="sync-dot" id="sync-dot"></div>
  <span id="sync-label">Connecting to Firebase…</span>
</div>

<header class="header">
  <div class="header-left">
    <div class="logo-mark">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="2" y="3" width="16" height="2" rx="1" fill="#c8941a"/>
        <rect x="2" y="7" width="11" height="2" rx="1" fill="#c8941a" opacity="0.6"/>
        <rect x="2" y="11" width="13" height="2" rx="1" fill="#c8941a" opacity="0.4"/>
        <circle cx="15" cy="15" r="3.5" stroke="#c8941a" stroke-width="1.5"/>
        <path d="M17.5 17.5L19 19" stroke="#c8941a" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <h1>Job Pipeline</h1>
      <p>Track · Follow Up · Close the Offer</p>
    </div>
  </div>
  <div class="stat-chips" id="stat-chips"></div>
</header>

<div class="toolbar">
  <input type="text" id="search-input" placeholder="Search company, role, contact…" oninput="applyFilter()">
  <select id="status-filter" onchange="applyFilter()">
    <option value="">All Statuses</option>
    <option>Saved</option><option>Applied</option>
    <option>Interviewing</option><option>Rejected</option><option>Offer</option>
  </select>
  <select id="industry-filter" onchange="applyFilter()">
    <option value="">All Industries</option>
  </select>
  <button class="btn-add" onclick="openModal()">+ Add Application</button>
</div>

<div class="pipeline-bar" id="pipeline-bar"></div>

<div class="dash" id="dash"></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('company')"     id="th-company">Company <span class="sort-arrow"></span></th>
        <th onclick="sortBy('position')"    id="th-position">Position <span class="sort-arrow"></span></th>
        <th onclick="sortBy('industry')"    id="th-industry">Industry <span class="sort-arrow"></span></th>
        <th onclick="sortBy('dateApplied')" id="th-dateApplied">Date Applied <span class="sort-arrow"></span></th>
        <th onclick="sortBy('status')"      id="th-status">Status <span class="sort-arrow"></span></th>
        <th>Salary Range</th>
        <th>Contact</th>
        <th onclick="sortBy('followup')"    id="th-followup">Follow-up <span class="sort-arrow"></span></th>
        <th>Notes</th>
        <th>Posting</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<div class="footer">
  <span id="footer-count">Connecting…</span>
  <div style="display:flex; gap:8px;">
    <button class="btn-export" onclick="printReport()">🖨 Print / Save PDF</button>
    <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
  </div>
</div>

<div id="print-report"></div>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <h2 id="modal-title">New Application</h2>
    <form onsubmit="handleSubmit(event)">
      <div class="form-grid">
        <div class="form-field"><label>Company Name *</label><input id="f-company" required placeholder="Acme Corp" oninput="updateIndustryHint()"></div>
        <div class="form-field"><label>Position Title *</label><input id="f-position" required placeholder="Senior Sales Manager" oninput="updateIndustryHint()"></div>
      </div>
      <div class="form-grid full">
        <div class="form-field">
          <label>Industry</label>
          <select id="f-industry" onchange="updateIndustryHint()">
            <option value="">✦ Auto-detect from company &amp; role</option>
          </select>
          <div class="field-hint" id="industry-hint"></div>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-field"><label>Date Applied</label><input id="f-date" type="date"></div>
        <div class="form-field"><label>Status</label>
          <select id="f-status">
            <option>Saved</option><option>Applied</option>
            <option>Interviewing</option><option>Rejected</option><option>Offer</option>
          </select>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-field"><label>Salary Range</label><input id="f-salary" placeholder="$80k – $100k"></div>
        <div class="form-field"><label>Follow-up Date</label><input id="f-followup" type="date"></div>
      </div>
      <div class="form-grid full">
        <div class="form-field"><label>Contact Name / Email</label><input id="f-contact" placeholder="Jane Doe — jane@company.com"></div>
      </div>
      <div class="form-grid full">
        <div class="form-field"><label>Link to Job Posting</label><input id="f-link" type="url" placeholder="https://…"></div>
      </div>
      <div class="form-grid full">
        <div class="form-field"><label>Notes</label><textarea id="f-notes" placeholder="Referral source, recruiter name, interview notes…"></textarea></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-save" id="modal-save-btn">Add Application</button>
      </div>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyBIl_-DwA6pqkkNGhn-p2vlU0LlhaMFfUs",
    authDomain:        "job-pipeline-tracker.firebaseapp.com",
    projectId:         "job-pipeline-tracker",
    storageBucket:     "job-pipeline-tracker.firebasestorage.app",
    messagingSenderId: "154071018332",
    appId:             "1:154071018332:web:a1eefc2e38524b3f63ef99",
    databaseURL:       "https://job-pipeline-tracker-default-rtdb.firebaseio.com"
  });

  const db  = firebase.database();
  const ref = db.ref('jobPipeline');
  const settingsRef = db.ref('jobPipelineSettings');
  let weeklyGoal = 10;

  settingsRef.on('value', snap => {
    const v = snap.val() || {};
    weeklyGoal = parseInt(v.weeklyGoal, 10) > 0 ? parseInt(v.weeklyGoal, 10) : 10;
    render();
  });

  function setWeeklyGoal() {
    const v = prompt('Applications per week goal:', weeklyGoal);
    if (v === null) return;
    const n = parseInt(v, 10);
    if (!n || n < 1) { alert('Enter a number of 1 or more.'); return; }
    settingsRef.set({ weeklyGoal: n }).catch(() => setSyncStatus('error', 'Goal save failed'));
  }

  const STATUSES = ['Saved','Applied','Interviewing','Rejected','Offer'];

  // ---------- Industry classification ----------
  const INDUSTRIES = [
    'Trades / Home Services','Construction','SaaS / Technology','Distribution / Wholesale',
    'Manufacturing','Healthcare','Finance / Insurance','Retail / Consumer',
    'Staffing / Recruiting','Real Estate','Automotive','Other'
  ];
  const INDUSTRY_KEYWORDS = {
    'Trades / Home Services':   ['plumb','hvac','heating','cooling','air condition','electric','roofing','pest','landscap','solar','garage door','restoration','home service','handyman','septic','drain','furnace','appliance repair','cleaning service','lawn'],
    'Construction':             ['construction','builder','contracting','general contractor','excavat','concrete','framing','remodel','masonry','paving'],
    'SaaS / Technology':        ['software','saas','tech','cloud','platform','app','cyber','data','digital','startup',' ai','artificial intelligence','crm','fintech','it services','engineering'],
    'Distribution / Wholesale': ['distribut','supply','wholesale','logistics','freight','warehouse','shipping','trucking','fulfillment'],
    'Manufacturing':            ['manufactur','industrial','fabricat','machining','assembly','plant','production'],
    'Healthcare':               ['health','medical','dental','clinic','hospital','pharma','care','wellness','therapy'],
    'Finance / Insurance':      ['bank','financial','finance','insurance','credit','mortgage','lending','capital','wealth','accounting','payroll'],
    'Retail / Consumer':        ['retail','store','consumer','ecommerce','e-commerce','merchandis','grocery','apparel'],
    'Staffing / Recruiting':    ['staffing','recruit','talent','workforce','hr '],
    'Real Estate':              ['real estate','realty','property','title','brokerage','apartments'],
    'Automotive':               ['automotive','auto ','dealership','car wash','tire','collision','fleet']
  };
  function detectIndustry(text) {
    const t = ' ' + (text||'').toLowerCase() + ' ';
    let best = 'Other', bestHits = 0;
    for (const [ind, words] of Object.entries(INDUSTRY_KEYWORDS)) {
      const hits = words.reduce((n,w) => n + (t.includes(w) ? 1 : 0), 0);
      if (hits > bestHits) { bestHits = hits; best = ind; }
    }
    return best;
  }
  // Industry for a job: manual pick wins, otherwise classify from its text
  function jobIndustry(j) {
    return j.industry || detectIndustry([j.company, j.position, j.notes].join(' '));
  }
  function populateIndustrySelects() {
    const opts = INDUSTRIES.map(i => `<option>${i}</option>`).join('');
    document.getElementById('industry-filter').innerHTML = '<option value="">All Industries</option>' + opts;
    document.getElementById('f-industry').innerHTML = '<option value="">✦ Auto-detect from company &amp; role</option>' + opts;
  }
  function updateIndustryHint() {
    const hint = document.getElementById('industry-hint');
    if (document.getElementById('f-industry').value) { hint.innerHTML = 'Set manually — auto-detect off for this job.'; return; }
    const text = document.getElementById('f-company').value + ' ' + document.getElementById('f-position').value;
    hint.innerHTML = text.trim() ? 'Auto-detect → <b>' + esc(detectIndustry(text)) + '</b>' : 'Leave on auto and it classifies itself as you type.';
  }

  let jobs = {}, editId = null, sortKey = 'dateApplied', sortDir = -1;
  let filterSearch = '', filterStatus = '', filterIndustry = '';

  function setSyncStatus(state, msg) {
    document.getElementById('sync-dot').className = 'sync-dot ' + state;
    document.getElementById('sync-label').textContent = msg;
  }

  ref.on('value', snap => {
    jobs = snap.val() || {};
    setSyncStatus('connected', 'Synced · ' + new Date().toLocaleTimeString());
    render();
  }, err => setSyncStatus('error', 'Error: ' + err.message));

  db.ref('.info/connected').on('value', snap => {
    if (!snap.val()) setSyncStatus('error', 'Offline — reconnecting…');
  });

  function uid()   { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function today() { return new Date().toISOString().slice(0,10); }

  function saveJob(data) {
    setSyncStatus('saving', 'Saving…');
    const id = editId || uid();
    ref.child(id).set({ ...(jobs[id]||{}), ...data, id })
      .catch(e => setSyncStatus('error', 'Save failed'));
  }

  function deleteJob(id) {
    ref.child(id).remove().catch(e => setSyncStatus('error', 'Delete failed'));
  }

  populateIndustrySelects();

  function applyFilter() {
    filterSearch   = document.getElementById('search-input').value.toLowerCase();
    filterStatus   = document.getElementById('status-filter').value;
    filterIndustry = document.getElementById('industry-filter').value;
    render();
  }

  function getList() {
    let list = Object.values(jobs);
    if (filterSearch) list = list.filter(j =>
      (j.company||'').toLowerCase().includes(filterSearch) ||
      (j.position||'').toLowerCase().includes(filterSearch) ||
      (j.contact||'').toLowerCase().includes(filterSearch) ||
      jobIndustry(j).toLowerCase().includes(filterSearch)
    );
    if (filterStatus)   list = list.filter(j => j.status === filterStatus);
    if (filterIndustry) list = list.filter(j => jobIndustry(j) === filterIndustry);
    list.sort((a,b) => {
      const val = j => sortKey === 'industry' ? jobIndustry(j) : (j[sortKey]||'');
      let av = val(a).toLowerCase(), bv = val(b).toLowerCase();
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
    return list;
  }

  function sortBy(key) {
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
    render();
  }

  function followupDisplay(dateStr) {
    if (!dateStr) return { text: '—', cls: '' };
    const d = new Date(dateStr + 'T00:00:00'), t = new Date();
    t.setHours(0,0,0,0);
    const diff = Math.round((d - t) / 86400000);
    if (diff < 0)   return { text: dateStr + ' ⚠',       cls: 'followup-overdue' };
    if (diff === 0) return { text: 'Today ●',             cls: 'followup-soon' };
    if (diff === 1) return { text: 'Tomorrow',            cls: 'followup-soon' };
    if (diff <= 3)  return { text: `${dateStr} (${diff}d)`, cls: 'followup-soon' };
    return { text: dateStr, cls: '' };
  }

  function getStats() {
    const c = {}; STATUSES.forEach(s => c[s] = 0);
    Object.values(jobs).forEach(j => { if (c[j.status] !== undefined) c[j.status]++; });
    return c;
  }

  // ---------- Insights ----------
  function weekStartISO() {
    const d = new Date(); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - (d.getDay() + 6) % 7); // back to Monday
    return d.toISOString().slice(0,10);
  }
  function pct(n, d) { return d > 0 ? Math.round(n / d * 100) + '%' : '—'; }

  function getInsights() {
    const all        = Object.values(jobs);
    const applied    = all.filter(j => j.status !== 'Saved');                       // actually submitted
    const interviews = all.filter(j => j.status === 'Interviewing' || j.status === 'Offer');
    const offers     = all.filter(j => j.status === 'Offer');
    const responded  = all.filter(j => ['Interviewing','Offer','Rejected'].includes(j.status));
    const ws = weekStartISO();
    const weekCount = applied.filter(j => j.dateApplied && j.dateApplied >= ws).length;

    // average age of applications still sitting in "Applied"
    const open = all.filter(j => j.status === 'Applied' && j.dateApplied);
    const now = new Date(); now.setHours(0,0,0,0);
    const avgAge = open.length
      ? Math.round(open.reduce((s,j) => s + (now - new Date(j.dateApplied + 'T00:00:00')) / 86400000, 0) / open.length)
      : null;

    // interview rate by industry (only industries you've actually applied to)
    const byInd = {};
    applied.forEach(j => {
      const i = jobIndustry(j);
      byInd[i] = byInd[i] || { applied: 0, interviews: 0 };
      byInd[i].applied++;
      if (j.status === 'Interviewing' || j.status === 'Offer') byInd[i].interviews++;
    });
    const signal = Object.entries(byInd)
      .map(([ind, v]) => ({ ind, ...v, rate: v.interviews / v.applied }))
      .sort((a,b) => b.rate - a.rate || b.applied - a.applied)
      .slice(0, 4);

    return { applied: applied.length, interviews: interviews.length, offers: offers.length,
             responded: responded.length, weekCount, avgAge, signal };
  }

  function renderDash() {
    const ins = getInsights();
    const goalPct = Math.min(100, Math.round(ins.weekCount / weeklyGoal * 100));
    const maxBar = Math.max(ins.applied, 1);
    const bar = n => Math.max(3, Math.round(n / maxBar * 100)) + '%';

    const signalHtml = ins.signal.length
      ? ins.signal.map(s => `
          <div class="sig-row">
            <span class="s-ind">${esc(s.ind)}</span>
            <span class="s-rate ${s.interviews ? '' : 'cold'}">${pct(s.interviews, s.applied)} <span style="font-weight:400;color:var(--text-dim)">(${s.interviews}/${s.applied})</span></span>
          </div>`).join('')
      : '<div class="dash-sub">Apply to a few jobs and this shows which industries respond.</div>';

    document.getElementById('dash').innerHTML = `
      <div class="dash-card">
        <h3>Weekly Goal <button class="goal-edit" onclick="setWeeklyGoal()" title="Change goal">✎</button></h3>
        <div class="dash-big">${ins.weekCount} <span style="font-size:14px;color:var(--text-muted)">/ ${weeklyGoal}</span></div>
        <div class="dash-sub">${ins.weekCount >= weeklyGoal ? 'Goal hit — keep the streak alive 🎯' : (weeklyGoal - ins.weekCount) + ' more application' + (weeklyGoal - ins.weekCount !== 1 ? 's' : '') + ' this week (Mon–Sun)'}</div>
        <div class="goal-track"><div class="goal-fill ${ins.weekCount >= weeklyGoal ? 'done' : ''}" style="width:${goalPct}%"></div></div>
      </div>
      <div class="dash-card">
        <h3>Funnel</h3>
        <div class="funnel-row"><span class="f-label">Applied</span><div class="f-bar" style="width:${bar(ins.applied)}"></div><span class="f-num">${ins.applied}</span></div>
        <div class="funnel-row f-int"><span class="f-label">Interviews</span><div class="f-bar" style="width:${bar(ins.interviews)}"></div><span class="f-num">${ins.interviews}</span><span class="f-pct">${pct(ins.interviews, ins.applied)}</span></div>
        <div class="funnel-row f-off"><span class="f-label">Offers</span><div class="f-bar" style="width:${bar(ins.offers)}"></div><span class="f-num">${ins.offers}</span><span class="f-pct">${pct(ins.offers, ins.interviews)}</span></div>
      </div>
      <div class="dash-card">
        <h3>Response Rate</h3>
        <div class="dash-big">${pct(ins.responded, ins.applied)}</div>
        <div class="dash-sub">${ins.responded} of ${ins.applied} heard back${ins.avgAge !== null ? ' · open apps waiting ' + ins.avgAge + 'd avg' : ''}</div>
      </div>
      <div class="dash-card">
        <h3>Industry Signal</h3>
        ${signalHtml}
      </div>`;
  }

  function render() {
    const s     = getStats();
    const total = Object.keys(jobs).length;
    const list  = getList();

    renderDash();

    // chips
    document.getElementById('stat-chips').innerHTML = `
      <span class="chip chip-gold">${total} Total</span>
      <span class="chip chip-green">${s['Interviewing']} Interviewing</span>
      <span class="chip chip-purple">${s['Offer']} Offer${s['Offer']!==1?'s':''}</span>`;

    // pipeline pills
    const dotMap = { Saved:'dot-saved', Applied:'dot-applied', Interviewing:'dot-interviewing', Rejected:'dot-rejected', Offer:'dot-offer' };
    document.getElementById('pipeline-bar').innerHTML = STATUSES.map(st => `
      <div class="p-pill ${filterStatus===st?'active':''}" onclick="toggleStatus('${st}')">
        <span class="dot ${dotMap[st]}"></span>
        <span class="count">${s[st]}</span>
        <span class="label">${st}</span>
      </div>`).join('');

    // sort headers
    ['company','position','industry','dateApplied','status','followup'].forEach(k => {
      const th = document.getElementById('th-'+k);
      if (!th) return;
      th.classList.toggle('active-sort', sortKey===k);
      th.querySelector('.sort-arrow').textContent = sortKey===k ? (sortDir>0?' ↑':' ↓') : '';
    });

    // table
    const tbody = document.getElementById('table-body');
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="11"><div class="empty">
        <div class="empty-icon">◈</div>
        <p>${total===0 ? 'No applications yet — hit <strong>+ Add Application</strong> to start.' : 'No results match your filters.'}</p>
      </div></td></tr>`;
      document.getElementById('footer-count').textContent = '0 records';
      return;
    }

    tbody.innerHTML = list.map(j => {
      const fu = followupDisplay(j.followup);
      const hide = v => v ? '' : ' class="td-hide-empty"';
      return `<tr>
        <td class="td-company">${esc(j.company||'—')}</td>
        <td class="td-position" data-label="Position">${esc(j.position||'—')}</td>
        <td data-label="Industry"><span class="ind-tag">${esc(jobIndustry(j))}</span></td>
        <td class="td-date" data-label="Applied">${j.dateApplied||'—'}</td>
        <td data-label="Status"><span class="badge badge-${j.status}">${j.status}</span></td>
        <td class="td-salary${j.salary?'':' td-hide-empty'}" data-label="Salary">${esc(j.salary||'—')}</td>
        <td class="td-contact${j.contact?'':' td-hide-empty'}" data-label="Contact">${esc(j.contact||'—')}</td>
        <td class="td-date${j.followup?'':' td-hide-empty'} ${fu.cls}" data-label="Follow-up">${fu.text}</td>
        <td class="td-notes${j.notes?'':' td-hide-empty'}" data-label="Notes" title="${esc(j.notes||'')}">${esc(j.notes||'—')}</td>
        <td${safeLink(j.link)?'':' class="td-hide-empty"'} data-label="Posting">${safeLink(j.link)?`<a class="link-anchor" href="${esc(safeLink(j.link))}" target="_blank" rel="noopener">View ↗</a>`:'—'}</td>
        <td class="td-actions">
          <button class="act-btn" onclick="openEdit('${j.id}')">✎</button>
          <button class="act-btn del" onclick="confirmDelete('${j.id}')">✕</button>
        </td>
      </tr>`;
    }).join('');

    document.getElementById('footer-count').textContent =
      list.length === total ? `${total} record${total!==1?'s':''}` : `${list.length} of ${total} records (filtered)`;
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function toggleStatus(st) {
    filterStatus = filterStatus === st ? '' : st;
    document.getElementById('status-filter').value = filterStatus;
    render();
  }

  function openModal(job) {
    editId = job ? job.id : null;
    document.getElementById('modal-title').textContent    = job ? 'Edit Application' : 'New Application';
    document.getElementById('modal-save-btn').textContent = job ? 'Save Changes' : 'Add Application';
    document.getElementById('f-company').value   = job?.company     || '';
    document.getElementById('f-position').value  = job?.position    || '';
    document.getElementById('f-industry').value  = job?.industry    || '';
    document.getElementById('f-date').value      = job?.dateApplied || today();
    document.getElementById('f-status').value    = job?.status      || 'Saved';
    document.getElementById('f-salary').value    = job?.salary      || '';
    document.getElementById('f-followup').value  = job?.followup    || '';
    document.getElementById('f-contact').value   = job?.contact     || '';
    document.getElementById('f-link').value      = job?.link        || '';
    document.getElementById('f-notes').value     = job?.notes       || '';
    document.getElementById('overlay').classList.add('open');
    updateIndustryHint();
    document.getElementById('f-company').focus();
  }

  function openEdit(id) { const j = jobs[id]; if (j) openModal(j); }
  function closeModal()  { document.getElementById('overlay').classList.remove('open'); editId = null; }
  function overlayClick(e) { if (e.target===document.getElementById('overlay')) closeModal(); }
  document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

  function handleSubmit(e) {
    e.preventDefault();
    const company  = document.getElementById('f-company').value.trim();
    const position = document.getElementById('f-position').value.trim();
    const notes    = document.getElementById('f-notes').value.trim();
    const manual   = document.getElementById('f-industry').value;
    saveJob({
      company, position, notes,
      industry:    manual || detectIndustry([company, position, notes].join(' ')),
      dateApplied: document.getElementById('f-date').value,
      status:      document.getElementById('f-status').value,
      salary:      document.getElementById('f-salary').value.trim(),
      followup:    document.getElementById('f-followup').value,
      contact:     document.getElementById('f-contact').value.trim(),
      link:        document.getElementById('f-link').value.trim(),
    });
    closeModal();
  }

  function confirmDelete(id) {
    if (confirm('Remove this application?')) deleteJob(id);
  }

  function exportCSV() {
    const headers = ['Company','Position','Industry','Date Applied','Status','Salary Range','Contact','Follow-up Date','Notes','Job Link'];
    const rows = Object.values(jobs).map(j =>
      [j.company,j.position,jobIndustry(j),j.dateApplied,j.status,j.salary,j.contact,j.followup,j.notes,j.link]
      .map(v => '"'+(v||'').replace(/"/g,'""')+'"')
    );
    const csv = [headers,...rows].map(r=>r.join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent('\uFEFF'+csv); // BOM so Excel reads UTF-8 correctly
    a.download = 'job-pipeline-'+today()+'.csv';
    a.click();
  }

  // Only render links that are real http(s) URLs
  function safeLink(u) { return /^https?:\/\//i.test(u||'') ? u : ''; }

  function printReport() {
    const total = Object.keys(jobs).length;
    if (total === 0) { alert('Nothing to print yet — add an application first.'); return; }

    const list = getList(); // respects current search / status filter / sort
    const s = getStats();
    const ins = getInsights();
    const scope = list.length === total
      ? `All applications (${total})`
      : `Filtered view — ${list.length} of ${total}`
        + (filterStatus ? ` · Status: ${filterStatus}` : '')
        + (filterSearch ? ` · Search: “${esc(filterSearch)}”` : '');

    const rowsHtml = list.map(j => {
      const link = safeLink(j.link);
      return `<tr>
        <td class="pr-company">${esc(j.company||'—')}<div class="pr-ind">${esc(jobIndustry(j))}</div></td>
        <td>${esc(j.position||'—')}</td>
        <td>${j.dateApplied||'—'}</td>
        <td><span class="pr-badge prb-${j.status}">${esc(j.status||'—')}</span></td>
        <td>${esc(j.salary||'—')}</td>
        <td>${esc(j.contact||'—')}</td>
        <td>${j.followup||'—'}</td>
        <td class="pr-notes">${esc(j.notes||'—')}</td>
        <td class="pr-link">${link ? esc(link) : '—'}</td>
      </tr>`;
    }).join('');

    const indCounts = {};
    list.forEach(j => { const i = jobIndustry(j); indCounts[i] = (indCounts[i]||0)+1; });
    const indLine = Object.entries(indCounts).sort((a,b)=>b[1]-a[1])
      .map(([i,n]) => `<b>${n}</b> ${esc(i)}`).join(' &nbsp;·&nbsp; ');

    document.getElementById('print-report').innerHTML = `
      <div class="pr-head">
        <h1>Job Pipeline Report</h1>
        <div class="pr-sub">Track · Follow Up · Close the Offer</div>
      </div>
      <div class="pr-meta">
        <span>${scope}</span>
        <span>Generated ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</span>
      </div>
      <div class="pr-stats">
        <b>${s['Saved']}</b> Saved &nbsp;·&nbsp; <b>${s['Applied']}</b> Applied &nbsp;·&nbsp;
        <b>${s['Interviewing']}</b> Interviewing &nbsp;·&nbsp; <b>${s['Offer']}</b> Offer${s['Offer']!==1?'s':''} &nbsp;·&nbsp;
        <b>${s['Rejected']}</b> Rejected
      </div>
      <div class="pr-stats" style="margin-top:-8px;">By industry: &nbsp;${indLine}</div>
      <div class="pr-stats" style="margin-top:-8px;">
        Funnel: <b>${ins.applied}</b> applied → <b>${ins.interviews}</b> interviews (${pct(ins.interviews,ins.applied)}) → <b>${ins.offers}</b> offers (${pct(ins.offers,ins.interviews)})
        &nbsp;·&nbsp; Response rate <b>${pct(ins.responded,ins.applied)}</b>
      </div>
      <table>
        <thead><tr>
          <th>Company</th><th>Position</th><th>Date Applied</th><th>Status</th>
          <th>Salary Range</th><th>Contact</th><th>Follow-up</th><th>Notes</th><th>Posting</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <div class="pr-footer">
        <span>Job Pipeline Tracker</span>
        <span>${list.length} record${list.length!==1?'s':''} printed</span>
      </div>`;

    window.print();
  }
</script>
</body>
</html>
